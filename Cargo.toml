[package]
name = "clipboard-tool"
version = "0.1.0"
edition = "2021"
description = "Lightweight cross-platform clipboard history manager"

[dependencies]
arboard = "3.6.1"
clipboard-master = "4.0.0"
eframe = "0.35.0"
egui = "0.35.0"
enigo = "0.6.1"
global-hotkey = "0.8.0"
# versions filled in by `cargo add` inside the nix dev shell

[profile.release]
opt-level = "z"     # optimize for size (resource-efficient goal)
lto = true
codegen-units = 1
strip = true
panic = "abort"
