[package]
name = "clipboard-tool"
version = "0.1.0"
edition = "2021"
description = "Lightweight cross-platform clipboard history manager"

[dependencies]
arboard = "3.6.1"
auto-launch = "0.6.0"
clipboard-master = "4.0.0"
dirs = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
enigo = "0.6.1"
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
tray-icon = "0.24.1"

# The tray needs a GTK main loop on Linux; matches the gtk version tray-icon/muda use.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = "z"     # optimize for size (resource-efficient goal)
lto = true
codegen-units = 1
strip = true
panic = "abort"
